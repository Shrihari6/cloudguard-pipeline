spring.application.name=cloudguard-backend

# Server - bind dynamically to Render/Cloud $PORT environment variable, defaulting to 8081 locally
server.port=${PORT:8081}

# Virtual threads (Project Loom) — Java 21
spring.threads.virtual.enabled=true

# MCP Server — implemented manually via CloudGuardMcpServer.java REST controller
# (No spring-ai-mcp-server dependency needed; pure REST endpoints at /api/mcp/**)

# Groq LLM API Key (loaded from GROQ_API_KEY environment variable or .env file via dotenv loader)
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
