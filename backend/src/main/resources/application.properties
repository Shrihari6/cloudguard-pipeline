spring.application.name=cloudguard-backend

# Server - bind dynamically to Render/Cloud $PORT environment variable, defaulting to 8081 locally
server.port=${PORT:8081}

# Virtual threads (Project Loom) — Java 21
spring.threads.virtual.enabled=true

# Spring AI MCP Server configuration
spring.ai.mcp.server.name=cloudguard-mcp-server
spring.ai.mcp.server.type=SYNC

# Groq LLM API Key (loaded from environment variable GROQ_API_KEY)
groq.api-key=${GROQ_API_KEY:}
